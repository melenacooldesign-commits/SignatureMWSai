<meta charset="UTF-8">

<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
  <tr>
    <td style="padding:0; font-family: Arial, Helvetica, sans-serif; line-height:1.4; color:#000000;">

      <!-- Имя -->
      <p style="margin:0; font-size:15px; font-weight:bold; color:#000000;">
        {{NAME}}
      </p>

      <!-- Должность (серым) -->
      <p style="margin:0 0 14px 0; font-size:13px; color:#7f7f7f;">
        {{POSITION}}
      </p>

      <!-- Подразделение / компания / контакты -->
      <p style="margin:0; font-size:13px; color:#000000;">
        Центр компетенций в области<br>искусственного интеллекта
      </p>
      <p style="margin:0; font-size:13px; color:#000000;">
        ООО «МВС ИИ»
      </p>
      <p style="margin:0; font-size:13px; color:#000000;">
        {{PHONE}}
      </p>
      <p style="margin:0 0 14px 0; font-size:13px;">
        <a href="mailto:{{EMAIL}}" style="color:#000000; text-decoration:none;">{{EMAIL}}</a>
      </p>

      <!-- Логотип. Если SVG не отображается в Gmail/Outlook —
           замените ссылку на PNG-версию (см. инструкцию в examples/signature.html) -->
      <p style="margin:0;">
        <img src="https://mts.ai/wp-content/uploads/white-mws.svg"
             width="80" height="45" alt="MWS AI"
             style="display:block; border:0; outline:none; text-decoration:none;">
      </p>

    </td>
  </tr>
</table>
