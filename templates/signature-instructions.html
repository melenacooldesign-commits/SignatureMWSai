<!-- =====================================================================
     ИНСТРУКЦИЯ ПО ВСТАВКЕ
     =====================================================================

     GMAIL (веб):
     1. Откройте этот HTML-файл в браузере (двойной клик).
     2. Выделите всю подпись мышкой (Ctrl+A внутри страницы) и Ctrl+C.
     3. В Gmail → Настройки (шестерёнка) → «Все настройки» → вкладка
        «Общие» → раздел «Подпись» → «Создать новую».
     4. Вставьте (Ctrl+V) в поле подписи. Сохраните изменения внизу страницы.

     OUTLOOK (новый Windows / Outlook на Mac / web):
     1. Откройте HTML-файл в браузере, выделите и скопируйте подпись.
     2. Файл → Параметры → Почта → Подписи → Создать.
     3. Вставьте в поле, сохраните.

     OUTLOOK (классический Windows):
     1. Откройте Outlook → Файл → Параметры → Почта → Подписи → Создать.
     2. Дайте имя подписи, оставьте окно открытым.
     3. Найдите папку подписей (в проводнике):
        %APPDATA%\Microsoft\Signatures
        Там будет файл с именем вашей подписи и расширением .htm
     4. Откройте этот файл в Блокноте, замените содержимое <body> на код
        выше (от <table> до </table>). Сохраните.
     5. В Outlook закройте и снова откройте окно подписей — она появится.

     ВАЖНО про логотип:
     SVG-формат блокируется в Gmail и не работает в Outlook для Windows.
     Если логотип не отображается — захостите PNG-версию на CDN/корпоративном
     сервере и замените URL в теге <img src="..."> на ссылку на PNG.
     ===================================================================== -->
